<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="app-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171C21" />
      <stop offset="100%" stop-color="#0A0F14" />
    </linearGradient>

    <linearGradient id="sg-shell-rim" x1="15%" y1="10%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#E4048A" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <linearGradient id="sg-rib-glow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="sg-photonic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Abyssal Squircle Carapace Background -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#app-bg-grad)" stroke="#3D484E" stroke-width="2" />
  <!-- Subtle inner glowing rim -->
  <rect x="3" y="3" width="122" height="122" rx="27" fill="none" stroke="#E4048A" stroke-width="1" stroke-opacity="0.25" />

  <!-- Centered Scaled Shell Mark -->
  <g transform="translate(6, 6) scale(0.9)" filter="url(#sg-photonic-glow)">
    <!-- Base Hinge & Auricles -->
    <path d="M 44 100 L 32 108 C 30.5 109 30 111 31 113 L 33 116 C 34 117.5 35.5 118 37 118 L 91 118 C 92.5 118 94 117.5 95 116 L 97 113 C 98 111 97.5 109 96 108 L 84 100 Z" 
          stroke="url(#sg-shell-rim)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Scalloped Fan Carapace Silhouette (7 Lobes) -->
    <path d="M 42 100 
             C 32 94 20 82 17 68
             C 14 55 21 44 28 39
             C 34 35 43 31 46 25
             C 50 18 58 16 64 16
             C 70 16 78 18 82 25
             C 85 31 94 35 100 39
             C 107 44 114 55 111 68
             C 108 82 96 94 86 100 Z"
          stroke="url(#sg-shell-rim)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- 7 Radiating Bioluminescent Ribs (Claw Cyan) -->
    <!-- Center Rib -->
    <path d="M 64 96 L 64 24" 
          stroke="url(#sg-rib-glow)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Inner Flanking Ribs -->
    <path d="M 61 96 Q 55 60 48 29" 
          stroke="url(#sg-rib-glow)" stroke-width="4.2" stroke-linecap="round" />
    <path d="M 67 96 Q 73 60 80 29" 
          stroke="url(#sg-rib-glow)" stroke-width="4.2" stroke-linecap="round" />

    <!-- Mid Flanking Ribs -->
    <path d="M 58 97 Q 44 68 35 43" 
          stroke="url(#sg-rib-glow)" stroke-width="4" stroke-linecap="round" />
    <path d="M 70 97 Q 84 68 93 43" 
          stroke="url(#sg-rib-glow)" stroke-width="4" stroke-linecap="round" />

    <!-- Outer Flanking Ribs -->
    <path d="M 54 99 Q 34 80 25 64" 
          stroke="url(#sg-rib-glow)" stroke-width="3.8" stroke-linecap="round" />
    <path d="M 74 99 Q 94 80 103 64" 
          stroke="url(#sg-rib-glow)" stroke-width="3.8" stroke-linecap="round" />
  </g>
</svg>
